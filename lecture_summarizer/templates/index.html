<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lecture Summarizer</h1>
            <p>Upload lecture videos and slides to generate structured notes</p>
        </header>

        <!-- Upload Section -->
        <section id="upload-section" class="card">
            <h2>Upload Lecture</h2>

            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <p>Drag & drop files here</p>
                    <p>or</p>
                    <div class="file-inputs">
                        <label class="file-label">
                            <input type="file" id="video-input" accept=".mp4,.mkv,.avi,.mov,.webm,.m4a,.mp3,.wav">
                            <span class="btn">Choose Video/Audio (required)</span>
                        </label>
                        <label class="file-label">
                            <input type="file" id="pdf-input" accept=".pdf">
                            <span class="btn btn-secondary">Choose Slides (optional)</span>
                        </label>
                    </div>
                </div>
            </div>

            <div id="selected-files" class="selected-files"></div>

            <button id="upload-btn" class="btn btn-primary" disabled>Upload & Process</button>
        </section>

        <!-- Progress Section -->
        <section id="progress-section" class="card" style="display: none;">
            <h2>Processing</h2>
            <div class="progress-info">
                <p id="progress-title"></p>
                <p id="progress-status"></p>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </section>

        <!-- Lectures List -->
        <section id="lectures-section" class="card">
            <h2>Your Lectures</h2>
            <div id="lectures-list" class="lectures-list">
                <p class="empty-state">No lectures yet. Upload a video to get started.</p>
            </div>
        </section>

        <!-- Lecture Detail View -->
        <section id="detail-section" class="card" style="display: none;">
            <button id="back-btn" class="btn btn-secondary">Back to List</button>
            <div id="lecture-detail">
                <h2 id="detail-title"></h2>
                <div id="detail-content" class="lecture-content"></div>
                <div id="detail-images" class="lecture-images"></div>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
